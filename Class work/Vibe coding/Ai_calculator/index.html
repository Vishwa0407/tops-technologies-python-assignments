<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Glassmorphism Calculator</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons 1.11.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">

  <!-- Ambient Glowing Background Elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <!-- Main Application Wrapper -->
  <main class="container py-4 min-vh-100 d-flex flex-column justify-content-center align-items-center">
    
    <div class="calculator-app-wrapper w-100">
      <div class="row g-4 justify-content-center align-items-start">
        
        <!-- Calculator Card -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <div class="glass-card calculator-card p-3 p-sm-4 position-relative">
            
            <!-- Header Controls: Title & Action Buttons -->
            <header class="d-flex justify-content-between align-items-center mb-3">
              <div class="d-flex align-items-center gap-2">
                <div class="app-icon-badge">
                  <i class="bi bi-calculator-fill"></i>
                </div>
                <div>
                  <h1 class="h6 mb-0 fw-bold brand-title">AI Calc</h1>
                  <span class="badge badge-subtle">PRO</span>
                </div>
              </div>

              <!-- Quick Action Toolbar -->
              <div class="d-flex align-items-center gap-2">
                <!-- Copy Result Button -->
                <button type="button" class="btn btn-action" id="copy-btn" title="Copy Result (Ctrl+C)" aria-label="Copy Result">
                  <i class="bi bi-clipboard"></i>
                </button>

                <!-- History Toggle Button -->
                <button type="button" class="btn btn-action position-relative" id="history-toggle-btn" title="Toggle History" aria-label="Toggle Calculation History">
                  <i class="bi bi-clock-history"></i>
                  <span class="position-absolute top-0 start-100 translate-middle p-1 bg-primary border border-light rounded-circle history-dot d-none" id="history-badge">
                    <span class="visually-hidden">New calculations</span>
                  </span>
                </button>

                <!-- Theme Toggle Button -->
                <button type="button" class="btn btn-action" id="theme-toggle-btn" title="Switch Theme" aria-label="Toggle Light and Dark Mode">
                  <i class="bi bi-sun-fill" id="theme-icon"></i>
                </button>
              </div>
            </header>

            <!-- Screen / Display Section -->
            <section class="display-container p-3 mb-4 rounded-4 position-relative" aria-live="polite">
              
              <!-- Copied Notification Toast -->
              <div class="copy-alert" id="copy-alert">
                <i class="bi bi-check-circle-fill me-1"></i> Copied to clipboard!
              </div>

              <!-- Expression / Previous Calculation Line -->
              <div class="display-expression text-end mb-1" id="display-expression" title="Expression History"></div>

              <!-- Main Active Value -->
              <div class="display-main text-end" id="display-main">0</div>

              <!-- Live Calculation Preview -->
              <div class="display-preview text-end mt-1" id="display-preview"></div>
            </section>

            <!-- Keypad Section -->
            <section class="keypad-grid" aria-label="Calculator Keypad">
              <!-- Row 1: Utility & Division -->
              <button type="button" class="calc-btn btn-function" data-action="clear" data-key="Escape" aria-label="Clear All">
                <span class="btn-text">AC</span>
              </button>
              <button type="button" class="calc-btn btn-function" data-action="delete" data-key="Backspace" aria-label="Delete last digit">
                <i class="bi bi-backspace"></i>
              </button>
              <button type="button" class="calc-btn btn-function" data-action="percent" data-key="%" aria-label="Percentage">
                <span class="btn-text">%</span>
              </button>
              <button type="button" class="calc-btn btn-operator" data-operator="÷" data-key="/" aria-label="Divide">
                <span class="btn-text">÷</span>
              </button>

              <!-- Row 2: 7, 8, 9, Multiplication -->
              <button type="button" class="calc-btn btn-number" data-number="7" data-key="7" aria-label="Seven">7</button>
              <button type="button" class="calc-btn btn-number" data-number="8" data-key="8" aria-label="Eight">8</button>
              <button type="button" class="calc-btn btn-number" data-number="9" data-key="9" aria-label="Nine">9</button>
              <button type="button" class="calc-btn btn-operator" data-operator="×" data-key="*" aria-label="Multiply">
                <span class="btn-text">×</span>
              </button>

              <!-- Row 3: 4, 5, 6, Subtraction -->
              <button type="button" class="calc-btn btn-number" data-number="4" data-key="4" aria-label="Four">4</button>
              <button type="button" class="calc-btn btn-number" data-number="5" data-key="5" aria-label="Five">5</button>
              <button type="button" class="calc-btn btn-number" data-number="6" data-key="6" aria-label="Six">6</button>
              <button type="button" class="calc-btn btn-operator" data-operator="-" data-key="-" aria-label="Subtract">
                <span class="btn-text">−</span>
              </button>

              <!-- Row 4: 1, 2, 3, Addition -->
              <button type="button" class="calc-btn btn-number" data-number="1" data-key="1" aria-label="One">1</button>
              <button type="button" class="calc-btn btn-number" data-number="2" data-key="2" aria-label="Two">2</button>
              <button type="button" class="calc-btn btn-number" data-number="3" data-key="3" aria-label="Three">3</button>
              <button type="button" class="calc-btn btn-operator" data-operator="+" data-key="+" aria-label="Add">
                <span class="btn-text">+</span>
              </button>

              <!-- Row 5: Sign (+/-), 0, Decimal (.), Equals (=) -->
              <button type="button" class="calc-btn btn-function" data-action="toggle-sign" data-key="±" aria-label="Positive or Negative">
                <span class="btn-text">±</span>
              </button>
              <button type="button" class="calc-btn btn-number" data-number="0" data-key="0" aria-label="Zero">0</button>
              <button type="button" class="calc-btn btn-number" data-action="decimal" data-key="." aria-label="Decimal point">.</button>
              <button type="button" class="calc-btn btn-equals" data-action="calculate" data-key="Enter" aria-label="Equal">
                <span class="btn-text">=</span>
              </button>
            </section>

            <!-- Keyboard shortcut hint -->
            <footer class="mt-3 text-center">
              <small class="keyboard-hint text-muted">
                <i class="bi bi-keyboard me-1"></i> Keyboard friendly: <kbd>0-9</kbd> <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> <kbd>Enter</kbd> <kbd>Del</kbd> <kbd>Esc</kbd>
              </small>
            </footer>

          </div>
        </div>

        <!-- History Side Panel -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4 history-column" id="history-panel-container">
          <div class="glass-card history-card p-3 p-sm-4 h-100">
            
            <!-- History Header -->
            <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary border-opacity-25">
              <div class="d-flex align-items-center gap-2">
                <i class="bi bi-clock-history text-primary"></i>
                <h2 class="h6 mb-0 fw-bold">Calculation History</h2>
              </div>
              <button type="button" class="btn btn-sm btn-clear-history" id="clear-history-btn" title="Clear all history">
                <i class="bi bi-trash3 me-1"></i> Clear
              </button>
            </div>

            <!-- History Items List -->
            <div class="history-list-wrapper" id="history-list">
              <!-- Empty state shown by default -->
              <div class="history-empty text-center py-5 text-muted">
                <i class="bi bi-journal-x fs-1 d-block mb-2 opacity-50"></i>
                <p class="mb-0 fw-medium">No calculations yet</p>
                <small class="opacity-75">Your completed calculations will appear here.</small>
              </div>
            </div>

            <!-- History Helper Footer -->
            <div class="mt-3 pt-2 text-center border-top border-secondary border-opacity-10">
              <small class="text-muted">
                <i class="bi bi-info-circle me-1"></i> Click any history entry to restore it
              </small>
            </div>

          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- Bootstrap 5.3.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Calculator Script -->
  <script src="script.js"></script>
</body>
</html>
